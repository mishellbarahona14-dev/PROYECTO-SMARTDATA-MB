name: Dynamic Databricks Notebook Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
    
    - name: Install jq & curl
      run: sudo apt-get update && sudo apt-get install -y jq curl
    
    - name: Prepare local notebooks
      run: |
        DEST_BASE="/smartdatayml2"
        echo "Preparando archivos locales desde la carpeta proceso/"
        mkdir -p notebooks_to_deploy
        
        for file in proceso/*.*; do
          if [ -f "$file" ]; then
            filename=$(basename "$file")
            name_no_ext="${filename%.*}"
            cp "$file" "notebooks_to_deploy/$name_no_ext"
            echo "Preparado: $filename -> notebooks_to_deploy/$name_no_ext"
          fi
        done
    
    - name: Deploy notebooks to Destination Workspace
      run: |
        DEST_HOST=${{ secrets.DATABRICKS_DEST_HOST }}
        DEST_TOKEN=${{ secrets.DATABRICKS_DEST_TOKEN }}
        DEST_BASE="/smartdatayml2"
        
        echo "Creando carpeta base $DEST_BASE si no existe..."
        curl -s -X POST \
          -H "Authorization: Bearer $DEST_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"path\":\"$DEST_BASE\"}" \
          "$DEST_HOST/api/2.0/workspace/mkdirs"

        for file in notebooks_to_deploy/*; do
          if [ -f "$file" ]; then
            name=$(basename "$file")
            dest_path="$DEST_BASE/$name"
            
            echo "Importando $file → $dest_path"
            response=$(curl -s -X POST \
              -H "Authorization: Bearer $DEST_TOKEN" \
              -H "Content-Type: multipart/form-data" \
              -F "path=$dest_path" \
              -F "format=SOURCE" \
              -F "language=PYTHON" \
              -F "overwrite=true" \
              -F "content=@$file" \
              "$DEST_HOST/api/2.0/workspace/import")
            echo "Response: $response"
          fi
        done
    
    - name: Check if workflow exists and delete if necessary
      run: |
        DEST_HOST=${{ secrets.DATABRICKS_DEST_HOST }}
        DEST_TOKEN=${{ secrets.DATABRICKS_DEST_TOKEN }}
        WORKFLOW_NAME="WF_SMARTDATA_MUSIC"
        
        echo "Verificando si existe el workflow: $WORKFLOW_NAME"
        
        workflows_response=$(curl -s -X GET \
          -H "Authorization: Bearer $DEST_TOKEN" \
          "$DEST_HOST/api/2.1/jobs/list")
        
        existing_job_id=$(echo "$workflows_response" | jq -r --arg name "$WORKFLOW_NAME" '.jobs[]? | select(.settings.name == $name) | .job_id')
        
        if [ "$existing_job_id" != "" ] && [ "$existing_job_id" != "null" ]; then
          echo "Workflow encontrado con ID: $existing_job_id. Eliminando..."
          delete_response=$(curl -s -X POST \
            -H "Authorization: Bearer $DEST_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"job_id\": $existing_job_id}" \
            "$DEST_HOST/api/2.1/jobs/delete")
          echo "Delete response: $delete_response"
        else
          echo "No se encontró workflow existente con nombre: $WORKFLOW_NAME"
        fi
    
    - name: Create Databricks Workflow WF_SMARTDATA_MUSIC
      run: |
        DEST_HOST=${{ secrets.DATABRICKS_DEST_HOST }}
        DEST_TOKEN=${{ secrets.DATABRICKS_DEST_TOKEN }}
        DEST_BASE="/smartdatayml2"
        
        echo "Creando workflow: WF_SMARTDATA_MUSIC usando clúster existente"
        
        cat > workflow_config.json << 'EOF'
        {
          "name": "WF_SMARTDATA_MUSIC",
          "format": "MULTI_TASK",
          "existing_cluster_id": "0816-010850-ygcbgg00",
          "tasks": [
            {
              "task_key": "tarea_prep_ambiente",
              "notebook_task": {
                "notebook_path": "/smartdatayml2/I.- Preparacion_Ambiente",
                "source": "WORKSPACE"
              }
            },
            {
              "task_key": "tarea_ingest_itunes",
              "notebook_task": {
                "notebook_path": "/smartdatayml2/II.- Ingest api-itunes",
                "source": "WORKSPACE"
              },
              "depends_on": [{"task_key": "tarea_prep_ambiente"}]
            },
            {
              "task_key": "tarea_ingest_spotify_tracks",
              "notebook_task": {
                "notebook_path": "/smartdatayml2/II.- Ingest spotify_tracks",
                "source": "WORKSPACE"
              },
              "depends_on": [{"task_key": "tarea_prep_ambiente"}]
            },
            {
              "task_key": "tarea_ingest_spotify_reviews",
              "notebook_task": {
                "notebook_path": "/smartdatayml2/II.- Ingest_spotify_reviews",
                "source": "WORKSPACE"
              },
              "depends_on": [{"task_key": "tarea_prep_ambiente"}]
            },
            {
              "task_key": "tarea_transform_music",
              "notebook_task": {
                "notebook_path": "/smartdatayml2/III. - Transform_MusicData",
                "source": "WORKSPACE"
              },
              "depends_on": [
                {"task_key": "tarea_ingest_itunes"},
                {"task_key": "tarea_ingest_spotify_tracks"}
              ]
            },
            {
              "task_key": "tarea_transform_reviews",
              "notebook_task": {
                "notebook_path": "/smartdatayml2/III.-Transform_Reviews",
                "source": "WORKSPACE"
              },
              "depends_on": [{"task_key": "tarea_ingest_spotify_reviews"}]
            },
            {
              "task_key": "tarea_load_gold",
              "notebook_task": {
                "notebook_path": "/smartdatayml2/IV.- Load_Gold",
                "source": "WORKSPACE"
              },
              "depends_on": [
                {"task_key": "tarea_transform_music"},
                {"task_key": "tarea_transform_reviews"}
              ]
            },
            {
              "task_key": "tarea_grants",
              "notebook_task": {
                "notebook_path": "/smartdatayml2/V.- Grants",
                "source": "WORKSPACE"
              },
              "depends_on": [{"task_key": "tarea_load_gold"}]
            }
          ],
          "max_concurrent_runs": 1
        }
        EOF
        
        create_response=$(curl -s -X POST \
          -H "Authorization: Bearer $DEST_TOKEN" \
          -H "Content-Type: application/json" \
          -d @workflow_config.json \
          "$DEST_HOST/api/2.1/jobs/create")
        
        echo "Workflow creation response: $create_response"
        
        job_id=$(echo "$create_response" | jq -r '.job_id')
        
        if [ "$job_id" != "" ] && [ "$job_id" != "null" ]; then
          echo "Workflow 'WF_SMARTDATA_MUSIC' creado exitosamente con ID: $job_id"
        else
          echo "Error al crear el workflow"
          echo "Response completo: $create_response"
          exit 1
        fi
    
    - name: Clean up
      run: |
        rm -rf notebooks_to_deploy
        rm -f workflow_config.json
    
    - name: Done
      run: |
        echo "¡Despliegue y creación de Workflow con clúster existente completados!"