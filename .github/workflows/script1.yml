name: Dynamic Databricks Music Platform Deploy

on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
    
    - name: Install jq & curl
      run: sudo apt-get update && sudo apt-get install -y jq curl
    
    - name: Deploy notebooks to Destination Workspace
      env:
        DEST_HOST: ${{ secrets.DATABRICKS_DEST_HOST }}
        DEST_TOKEN: ${{ secrets.DATABRICKS_DEST_TOKEN }}
      run: |
        DEST_BASE="/smartdatayml2"
        
        if [ -z "$DEST_HOST" ] || [ -z "$DEST_TOKEN" ]; then
          echo "Error crítico: Los secretos DATABRICKS_DEST_HOST o DATABRICKS_DEST_TOKEN não están configurados."
          exit 1
        fi
        
        echo "Creando o verificando directorio base en Databricks: $DEST_BASE"
        curl -s -X POST \
          -H "Authorization: Bearer $DEST_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"path\":\"$DEST_BASE\"}" \
          "$DEST_HOST/api/2.0/workspace/mkdirs"

        for file in proceso/*.*; do
          if [ -f "$file" ]; then
            name=$(basename "$file")
            dest_path="$DEST_BASE/$name"
            
            echo "Importando $file → $dest_path"
            curl -s -X POST \
              -H "Authorization: Bearer $DEST_TOKEN" \
              -H "Content-Type: multipart/form-data" \
              -F "path=$dest_path" \
              -F "format=SOURCE" \
              -F "language=PYTHON" \
              -F "overwrite=true" \
              -F "content=@$file" \
              "$DEST_HOST/api/2.0/workspace/import"
          fi
        done
    
    - name: Check if workflow exists and delete if necessary
      env:
        DEST_HOST: ${{ secrets.DATABRICKS_DEST_HOST }}
        DEST_TOKEN: ${{ secrets.DATABRICKS_DEST_TOKEN }}
      run: |
        WORKFLOW_NAME="WF_SMARTDATA_MUSIC"
        
        workflows_response=$(curl -s -X GET \
          -H "Authorization: Bearer $DEST_TOKEN" \
          "$DEST_HOST/api/2.1/jobs/list")
        
        existing_job_id=$(echo "$workflows_response" | jq -r --arg name "$WORKFLOW_NAME" '.jobs[]? | select(.settings.name == $name) | .job_id')
        
        if [ "$existing_job_id" != "" ] && [ "$existing_job_id" != "null" ]; then
          echo "Eliminando workflow anterior ID: $existing_job_id"
          curl -s -X POST \
            -H "Authorization: Bearer $DEST_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"job_id\": $existing_job_id}" \
            "$DEST_HOST/api/2.1/jobs/delete"
        fi
        
    - name: Create Databricks Workflow WF_SMARTDATA_MUSIC
      env:
        DEST_HOST: ${{ secrets.DATABRICKS_DEST_HOST }}
        DEST_TOKEN: ${{ secrets.DATABRICKS_DEST_TOKEN }}
      run: |
        DEST_BASE="/smartdatayml2"
        
        cat > workflow_config.json << EOF
        {
          "name": "WF_SMARTDATA_MUSIC",
          "format": "MULTI_TASK",
          "tasks": [
            {
              "task_key": "Prep_Ambiente",
              "notebook_task": {
                "notebook_path": "$DEST_BASE/I.- Preparacion_Ambiente.ipynb",
                "source": "WORKSPACE"
              },
              "job_cluster_key": "Cluster_SD"
            }
          ],
          "job_clusters": [
            {
              "job_cluster_key": "Cluster_SD",
              "new_cluster": {
                "spark_version": "13.3.x-scala2.12",
                "node_type_id": "i3.xlarge",
                "driver_node_type_id": "i3.xlarge",
                "num_workers": 0,
                "data_security_mode": "SINGLE_USER"
              }
            }
          ]
        }
        EOF
        
        echo "Enviando solicitud de creación a Databricks..."
        response=$(curl -s -X POST \
          -H "Authorization: Bearer $DEST_TOKEN" \
          -H "Content-Type: application/json" \
          -d @workflow_config.json \
          "$DEST_HOST/api/2.1/jobs/create")
        
        echo "Respuesta detallada de Databricks: $response"